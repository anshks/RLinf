# WorldGym cloth folding training with Pi0.5 using GRPO
# World model-based imagined rollouts with GPT-4o reward evaluation

defaults:
  - env/worldgym_cloth@env.train
  - env/worldgym_cloth@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "/scratch/nl2752/wmrl_logs"
    project_name: rlinf
    experiment_name: "worldgym_cloth_grpo_pi05"
    logger_backends: ["wandb"]  # tensorboard, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  eval_policy_path: null
  val_check_interval: 5
  save_interval: 5
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  repeat_reward_across_steps: True
  rollout_epoch: 8
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: null
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 1.0
  gae_lambda: 1.0

  filter_rewards: True
  rewards_lower_bound: 1 #trajectory min reward 0
  rewards_upper_bound: 79 #trajectory max reward 80

  # Sampling params for Pi0.5
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # Length params
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 32  # parallel rollouts; must be divisible by group_size (8)
    max_episode_steps: 80  # Must be divisible by num_action_chunks (10)
    max_steps_per_rollout_epoch: 80  # Must be divisible by num_action_chunks (10)
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}

    # WorldGym-specific overrides
    data_dir: "/projects/work/yang-lab/projects/wmrl/fold_depth_split_worldgym/train"
    world_model_checkpoint: "/projects/work/yang-lab/projects/wmrl/fold_clothes_600m_lerobot_ds1/ckpt_000228000.pt"
    use_gpt_rewards: True
    gpt_parallel_workers: 8

    backend_cfg:
      batch_size: 16 # ${env.train.total_num_envs}
      gen_num_image_each_step: 1
      max_episode_steps: ${env.train.max_episode_steps}
    video_cfg:
      save_video: True
      info_on_video: False

  eval:
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80  # Must be divisible by num_action_chunks (10)
    max_steps_per_rollout_epoch: 80  # Must be divisible by num_action_chunks (10)
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True

    # Eval uses test split
    data_dir: "/projects/work/yang-lab/projects/wmrl/fold_depth_split_worldgym/test"
    world_model_checkpoint: "/projects/work/yang-lab/projects/wmrl/fold_clothes_600m_lerobot_ds1/ckpt_000228000.pt"
    use_gpt_rewards: True
    gpt_parallel_workers: 8

    backend_cfg:
      batch_size: 2 # ${env.eval.total_num_envs}
      gen_num_image_each_step: 1
      max_episode_steps: ${env.eval.max_episode_steps}

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: null  # Pi0.5 checkpoint has built-in action normalization
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/projects/work/yang-lab/projects/wmrl/pi05_nodepth_newaction_rtc_ds1_ckpt"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 512
  seed: 42
  enable_offload: False

  model:
    model_path: "/projects/work/yang-lab/projects/wmrl/pi05_nodepth_newaction_rtc_ds1_ckpt"
    num_steps: 4  # Action prediction steps
    # Pi0.5 has 20D actions for cloth folding (embedded in checkpoint)
    action_dim: 21
    use_proprio: False
    # Override OpenPI config to match checkpoint structure
    openpi:
      config_name: "worldgym_cloth"  # WorldGym config without wrist images
      num_images_in_input: 1

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    weight_decay: 0.01

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False  # Pi0.5 doesn't support gradient checkpointing
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
